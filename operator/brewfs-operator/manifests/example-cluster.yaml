apiVersion: storage.brewfs.io/v1alpha1
kind: BrewFSCluster
metadata:
  name: demo
spec:
  redis: {}
  rustfs:
    bucket: brewfs-data
    storageSize: 20Gi
  mountConfig:
    mountPoint: /mnt/brewfs
    chunkSize: 67108864
    blockSize: 4194304
  workspace:
    enabled: true
    catalogBackend: Redis
    namespace: demo-workspaces
    leaseTtlSeconds: 30
    heartbeatSeconds: 10
    gcGraceSeconds: 60
    catalogStorageSize: 5Gi
