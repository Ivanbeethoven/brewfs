apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: brewfs-workspace
provisioner: csi.brewfs.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: false
parameters:
  # Each writable BrewFS workspace needs its own StorageClass (or a reviewed
  # broker that fills these values). Do not point multiple independent writers
  # at one workspace UUID.
  cluster: replace-with-brewfs-cluster
  workspace: 00000000-0000-0000-0000-000000000001
  config: /etc/brewfs/config.yaml
  binary: /usr/local/bin/brewfs
  mount_root: /var/lib/brewfs-csi/mounts
