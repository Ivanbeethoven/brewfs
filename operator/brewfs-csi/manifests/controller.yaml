apiVersion: v1
kind: Service
metadata:
  name: brewfs-csi-controller
  namespace: brewfs-csi-system
spec:
  selector:
    app.kubernetes.io/name: brewfs-csi-controller
  ports:
    - name: grpc
      port: 10000
      targetPort: 10000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brewfs-csi-controller
  namespace: brewfs-csi-system
  labels:
    app.kubernetes.io/name: brewfs-csi-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: brewfs-csi-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brewfs-csi-controller
    spec:
      serviceAccountName: brewfs-csi-controller
      containers:
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.2.0
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election=true
            - --extra-create-metadata=true
          volumeMounts:
            - name: csi-socket
              mountPath: /csi
        - name: brewfs-csi
          image: ghcr.io/ivanbeethoven/brewfs-csi:dev
          imagePullPolicy: IfNotPresent
          args:
            - --socket=/csi/csi.sock
            - --listen=0.0.0.0:10000
            - --state-dir=/var/lib/brewfs-csi
          ports:
            - name: grpc
              containerPort: 10000
          volumeMounts:
            - name: csi-socket
              mountPath: /csi
            - name: controller-state
              mountPath: /var/lib/brewfs-csi
      volumes:
        - name: csi-socket
          emptyDir: {}
        - name: controller-state
          emptyDir: {}
