services:
  redis:
    image: ${BREWFS_REDIS_IMAGE:-docker.io/library/redis:7.2-alpine}
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:26379:6379"
    volumes:
      - brewfs-redis-data:/data

  rustfs:
    image: ${BREWFS_RUSTFS_IMAGE:-docker.io/rustfs/rustfs:latest}
    command:
      - /data
    environment:
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
    volumes:
      - brewfs-rustfs-data:/data

  perf:
    image: ${BREWFS_PERF_BASE_IMAGE:-docker.io/library/debian:trixie-slim}
    privileged: true
    depends_on:
      - redis
      - rustfs
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
    environment:
      REDIS_URL: redis://redis:6379
      BREWFS_META_BACKEND: redis
      BREWFS_META_URL: redis://redis:6379/0
      BREWFS_DATA_BACKEND: ${BREWFS_DATA_BACKEND:-s3}
      BREWFS_DATA_DIR: /var/lib/brewfs/data
      BREWFS_S3_BUCKET: ${BREWFS_S3_BUCKET:-brewfs-data}
      BREWFS_S3_ENDPOINT: ${BREWFS_S3_ENDPOINT:-http://rustfs:9000}
      BREWFS_S3_REGION: ${BREWFS_S3_REGION:-us-east-1}
      BREWFS_S3_FORCE_PATH_STYLE: ${BREWFS_S3_FORCE_PATH_STYLE:-true}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      BREWFS_MOUNT_POINT: /mnt/brewfs
      BREWFS_HOME: /var/lib/brewfs
      BREWFS_APT_MIRROR: ${BREWFS_APT_MIRROR:-}
      RUST_LOG: brewfs=info
    volumes:
      - ${BREWFS_BINARY_DIR:-../../target/docker}:/brewfs-bin:ro
      - ./wslc-tools:/wslc-tools:ro
      - ./artifacts:/artifacts

volumes:
  brewfs-redis-data:
  brewfs-rustfs-data:
